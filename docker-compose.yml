networks:
  private-net:
    driver: bridge
    internal: true
  
  public-net:
    driver: bridge

services:
  backend:
    hostname: backend
    networks:
      - private-net
    build:
      context: ./backend
    # Published for local debugging: curl http://localhost:8080/health
    ports:
      - "8080:8080"
    environment:
      - PORT=8080

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://backend:8080/health | grep -qi '\"status\":[[:space:]]*\"healthy\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  proxy:
    hostname: proxy
    networks:
      - private-net
      - public-net
    build:
      context: ./proxy
    # Published for local debugging: curl http://localhost:8081/nginx-health
    ports:
      - "8081:8081"
    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://proxy:8081/nginx-health | grep -qi '\"proxy\":[[:space:]]*\"ok\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  test-runner:
    networks:
      - public-net
    build:
      context: ./test-runner
    depends_on:
      proxy:
        condition: service_healthy

    environment:
      - PROXY_URL=http://proxy:8081
