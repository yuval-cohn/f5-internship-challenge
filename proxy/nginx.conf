# Send nginx logs to the container's stdout/stderr so that
# `docker compose logs proxy` shows them on any base image.
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;

    # Bypass buffer copying for file transfers (zero-copy)
    sendfile on;

    # Send full TCP packets instead of small ones (works with sendfile)
    tcp_nopush on;

    # Disable Nagle's algorithm to send small packets immediately (best for keepalives)
    tcp_nodelay on;

    # Allow client connection reuse
    keepalive_timeout 65;
    keepalive_requests 1000;

    # Hide Nginx version number in error pages and Server headers
    server_tokens off;

    # Buffer sizes for incoming request bodies and headers
    client_body_buffer_size 128k;
    client_max_body_size 16m; # Adjust based on max allowed file uploads
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Timeout limits for reading client payload/headers
    client_body_timeout 10s;
    client_header_timeout 10s;

    # Timeout for sending response to the client
    send_timeout 10s;

    # Close connections on unresponding clients to free memory
    reset_timedout_connection on;

    # Rate limit zone MUST be defined in the http block
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    upstream app_backend {
        server backend:8080;
        # Connection pool for proxy_http_version 1.1 keepalives
        keepalive 32;
    }

    server {
        listen 8081;
        server_name localhost;

        location / {
            proxy_pass http://app_backend;
            
            # Force HTTP/1.1 for persistent connection support
            proxy_http_version 1.1;
            # Clear the Connection header to enable upstream keepalives
            proxy_set_header Connection "";

            # Standard Forward Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Proxy Buffering & Timeouts
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 8 8k;
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location /nginx-health {
            default_type application/json;
            return 200 '{"proxy": "ok"}';
        }
    }
}